name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub workflows
        uses: rhysd/actionlint@v1.7.12

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run syntax checks
        run: pnpm check:syntax

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          owner_lower="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repo_lower="$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')"
          site_url="https://${owner_lower}.github.io"

          if [ "$repo_lower" = "${owner_lower}.github.io" ]; then
            site_base="/"
            echo "LEGACY_SITE_BASE=/blog/" >> "$GITHUB_ENV"
          else
            site_base="/${repo}/"
          fi

          {
            echo "SITE_URL=${site_url}"
            echo "PUBLIC_REPOSITORY_URL=https://github.com/${GITHUB_REPOSITORY}"
          } >> "$GITHUB_ENV"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            short_sha="${PR_HEAD_SHA:0:7}"
            preview_base="${site_base}pr-preview/pr-${PR_NUMBER}/${short_sha}/"
            {
              echo "SITE_BASE=${preview_base}"
              echo "PREVIEW_PR_NUMBER=${PR_NUMBER}"
              echo "PREVIEW_HEAD_SHA=${PR_HEAD_SHA}"
              echo "PREVIEW_SHORT_SHA=${short_sha}"
              echo "PREVIEW_DESTINATION=pr-preview/pr-${PR_NUMBER}/${short_sha}"
              echo "PREVIEW_URL=${site_url}${preview_base}"
            } >> "$GITHUB_ENV"
          else
            echo "SITE_BASE=${site_base}" >> "$GITHUB_ENV"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks and build
        run: pnpm check:quality

      - name: Write preview metadata
        if: github.event_name == 'pull_request'
        run: |
          cat > dist/preview-meta.json <<EOF
          {
            "pr_number": "${PREVIEW_PR_NUMBER}",
            "head_sha": "${PREVIEW_HEAD_SHA}",
            "short_sha": "${PREVIEW_SHORT_SHA}",
            "destination_dir": "${PREVIEW_DESTINATION}",
            "preview_url": "${PREVIEW_URL}"
          }
          EOF

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Summarize PR preview
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Commit preview"
            echo ""
            echo "- PR: #${PREVIEW_PR_NUMBER}"
            echo "- Commit: \`${PREVIEW_SHORT_SHA}\`"
            echo "- Isolated URL: ${PREVIEW_URL}"
            echo "- Production is unchanged; formal deployment is a separate manual workflow."
          } >> "$GITHUB_STEP_SUMMARY"
