	(() => {
		const doNotTrack = navigator.doNotTrack === '1' || window.doNotTrack === '1';
		const scrollMilestones = [25, 50, 75, 90, 100];

		const article = document.querySelector('[data-analytics-page="article"]');
		const articleParams =
			article ?
				{
					content_type: article.dataset.analyticsCollection,
					item_id: article.dataset.analyticsArticleId,
					language: article.dataset.analyticsLang || lang,
				}
			:	{ language: lang };

		const sendEvent = (name, params = {}) => {
			if (doNotTrack || typeof window.gtag !== 'function') return;
			window.gtag('event', name, {
				...articleParams,
				...params,
			});
		};

		const pageKind = () => {
			if (article) return 'article';
			const segments = window.location.pathname.split('/').filter(Boolean);
			const contentSegments = segments[0] === 'blog' ? segments.slice(1) : segments;
			if (contentSegments[0] === 'zh' || contentSegments[0] === 'en') contentSegments.shift();
			return contentSegments[0] || 'home';
		};

		const linkPath = (href) => {
			try {
				const url = new URL(href, window.location.href);
				return url.origin === window.location.origin ? url.pathname : undefined;
			} catch {
				return undefined;
			}
		};

		const linkDomain = (href) => {
			try {
				const url = new URL(href, window.location.href);
				return url.origin === window.location.origin ? undefined : url.hostname;
			} catch {
				return undefined;
			}
		};

		const classifyLink = (link) => {
			if (link.closest('.brand')) return { event: 'lf_navigation_click', type: 'brand' };
			if (link.closest('.nav')) return { event: 'lf_navigation_click', type: 'primary_nav' };
			if (link.closest('.lang-switch')) return { event: 'lf_language_switch', type: 'language_switch' };
			if (link.closest('.footer-links')) return { event: 'lf_navigation_click', type: 'footer_nav' };
			if (link.closest('.channel-list')) return { event: 'lf_content_discovery', type: 'home_channel' };
			if (link.closest('.entry-row') && link.matches('.entry-title')) return { event: 'lf_content_discovery', type: 'entry_title' };
			if (link.closest('.tag-cloud')) return { event: 'lf_tag_click', type: 'tag_cloud' };
			if (link.closest('.tag-list')) return { event: 'lf_tag_click', type: 'tag_list' };
			if (link.closest('.article-actions')) return { event: 'lf_article_resource_click', type: 'article_resource' };
			if (link.closest('.authors')) return { event: 'lf_author_profile_click', type: 'author_profile' };
			if (link.closest('.article-body')) return { event: 'lf_article_body_link_click', type: 'article_body_link' };
			return linkDomain(link.href) ? { event: 'lf_outbound_click', type: 'outbound' } : { event: 'lf_internal_click', type: 'internal' };
		};

		const lightbox = document.querySelector('[data-image-lightbox]');
		const zoomValue = document.querySelector('[data-lightbox-zoom-value]');
		let imageLightboxOpen = false;

		const recordImageOpen = (imageTrigger) => {
			const images = [...document.querySelectorAll('.article-body img[data-lightbox-trigger]')];
			imageLightboxOpen = true;
			sendEvent('lf_article_image_open', {
				image_index: images.indexOf(imageTrigger) + 1,
				image_count: images.length,
			});
		};

		const recordImageZoom = (direction) => {
			window.setTimeout(() => {
				sendEvent('lf_article_image_zoom', {
					zoom_direction: direction,
					zoom_value: zoomValue?.textContent,
				});
			}, 0);
		};

		if (lightbox && typeof MutationObserver !== 'undefined') {
			new MutationObserver(() => {
				if (!imageLightboxOpen || !lightbox.hidden) return;
				imageLightboxOpen = false;
				sendEvent('lf_article_image_close');
			}).observe(lightbox, { attributes: true, attributeFilter: ['hidden'] });
		}

		document.addEventListener('click', (event) => {
			const target = event.target instanceof Element ? event.target : null;
			if (!target) return;

			const imageTrigger = target.closest('.article-body img[data-lightbox-trigger]');
			if (imageTrigger) {
				recordImageOpen(imageTrigger);
				return;
			}

			const zoomIn = target.closest('[data-lightbox-zoom-in]');
			const zoomOut = target.closest('[data-lightbox-zoom-out]');
			if (zoomIn || zoomOut) {
				recordImageZoom(zoomIn ? 'in' : 'out');
				return;
			}

			const link = target.closest('a[href]');
			if (!link) return;

			const classification = classifyLink(link);
			sendEvent(classification.event, {
				link_type: classification.type,
				link_path: linkPath(link.href),
				link_domain: linkDomain(link.href),
				page_kind: pageKind(),
			});
		});

		document.addEventListener('keydown', (event) => {
			const target = event.target instanceof Element ? event.target : null;
			if (!target) return;

			const imageTrigger = target.matches('.article-body img[data-lightbox-trigger]') ? target : null;
			if (imageTrigger && (event.key === 'Enter' || event.key === ' ')) {
				recordImageOpen(imageTrigger);
				return;
			}

			if (!imageLightboxOpen) return;
			if (event.key === '+' || event.key === '=') recordImageZoom('in');
			if (event.key === '-' || event.key === '_') recordImageZoom('out');
			if (event.key === '0') recordImageZoom('reset');
		});

		document.addEventListener(
			'wheel',
			(event) => {
				const target = event.target instanceof Element ? event.target : null;
				if (!imageLightboxOpen || !target?.closest('[data-lightbox-stage]') || !(event.ctrlKey || event.metaKey)) return;
				recordImageZoom(event.deltaY < 0 ? 'in' : 'out');
			},
			{ passive: true },
		);

		if (!article) return;

		let maxDepth = 0;
		let activeSeconds = 0;
		const sentScrollMilestones = new Set();
		let sentEngagedRead = false;
		let scrollTickScheduled = false;

		const scrollDepth = () => {
			const scrollable = document.documentElement.scrollHeight - window.innerHeight;
			if (scrollable <= 0) return 100;
			return Math.min(100, Math.max(0, Math.round((window.scrollY / scrollable) * 100)));
		};

		const maybeSendReadingEvents = () => {
			maxDepth = Math.max(maxDepth, scrollDepth());
			for (const milestone of scrollMilestones) {
				if (maxDepth < milestone || sentScrollMilestones.has(milestone)) continue;
				sentScrollMilestones.add(milestone);
				sendEvent('lf_article_scroll_depth', {
					scroll_depth: milestone,
					active_seconds: activeSeconds,
				});
			}

			if (!sentEngagedRead && activeSeconds >= 45 && maxDepth >= 50) {
				sentEngagedRead = true;
				sendEvent('lf_article_engaged_read', {
					scroll_depth: maxDepth,
					active_seconds: activeSeconds,
				});
			}
		};

		const tick = () => {
			if (document.visibilityState === 'visible') activeSeconds += 1;
			maybeSendReadingEvents();
		};

		const scheduleScrollRead = () => {
			if (scrollTickScheduled) return;
			scrollTickScheduled = true;
			window.requestAnimationFrame(() => {
				scrollTickScheduled = false;
				maybeSendReadingEvents();
			});
		};

		window.addEventListener('scroll', scheduleScrollRead, { passive: true });
		document.addEventListener('visibilitychange', maybeSendReadingEvents);
		window.setInterval(tick, 1000);
		maybeSendReadingEvents();
	})();
})();</script> </body></html>
